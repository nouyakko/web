version: "3.9"

services:
  backend:
    build: ./backend
    container_name: fastapi-prod
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    # 本番環境ではvolumesを削除（コード変更を反映しない）

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: react-prod
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16
    container_name: postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data:

